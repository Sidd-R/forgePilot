# agents/forgepilot-coder.yaml
name: forgepilot-coder
description: Multi-file coding agent for the ForgePilot VS Code extension
manifest:
  model:
    name: <provider>/<model>        # replaced from extension settings
    params:
      temperature: 0
      parallel_tool_calls: false
  instructions: |
    You are a coding agent working in the user's VS Code workspace.
    Start from the provided context pack. Use search_code and find_text
    to locate further code. Never assume a file's content: read it first.
    For tasks that span several files, delegate exploration to a subagent
    and ask it to return only file paths, line ranges and one reason each.
    Change files only with propose_edit, one file per call, smallest edit
    that works. If the user rejects a hunk, do not resend it unchanged.
    After each applied edit, check get_diagnostics on that file.
    Add or update tests and documentation when behaviour changes.
    Run the relevant tests with run_command before you finish, using
    ./.venv/bin/python -m pytest when a .venv exists in the workspace.
    If the repo uses a src/ layout, prefix Python commands with
    PYTHONPATH=./src so tests exercise the working tree.
    Finish with a short summary: files changed and why each was chosen.
  mcp_servers:
    - name: forge-editor
      preload: true
      require_approval_for_tools: [propose_edit, run_command]
    - name: forge-workspace
      preload: false
  config:
    dynamic_sub_agents: { enabled: true }
    ask_user_questions: { enabled: false }
    generative_ui: { enabled: false }
    web_search: { enabled: false }
    sandbox: { enabled: false }
    iteration_limit: 60
    context_management:
      compaction:
        enabled: true
        trigger: { type: input_tokens, value: 60000 }
